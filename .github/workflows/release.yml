name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: zoomies.exe
            asset: zoomies-win-x64.exe
          - os: ubuntu-latest
            rid: linux-x64
            artifact: zoomies
            asset: zoomies-linux-x64
          - os: macos-latest
            rid: osx-arm64
            artifact: zoomies
            asset: zoomies-osx-arm64
          - os: macos-latest
            rid: osx-x64
            artifact: zoomies
            asset: zoomies-osx-x64

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: >
          dotnet publish src/Zoomies.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o publish

      - name: Rename binary
        shell: bash
        run: mv "publish/${{ matrix.artifact }}" "publish/${{ matrix.asset }}"

      - name: Bench Test
        if: matrix.rid != 'osx-x64'
        shell: bash
        run: ./publish/${{ matrix.asset }} bench 6

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: publish/${{ matrix.asset }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
