name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: zoomies.exe
          - os: ubuntu-latest
            rid: linux-x64
            artifact: zoomies
          - os: macos-latest
            rid: osx-arm64
            artifact: zoomies
          - os: macos-latest
            rid: osx-x64
            artifact: zoomies

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: >
          dotnet publish src/Zoomies.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained false
          -p:PublishSingleFile=true
          -p:DebugType=none
          -o publish

      - name: Compute asset name
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"                                   # v5.0 -> 5.0
          ext=""; [[ "${{ matrix.artifact }}" == *.exe ]] && ext=".exe"
          echo "ASSET=zoomies-${ver}-${{ matrix.rid }}${ext}" >> "$GITHUB_ENV"

      - name: Rename binary
        shell: bash
        run: mv "publish/${{ matrix.artifact }}" "publish/$ASSET"

      - name: Bench Test
        if: matrix.rid != 'osx-x64'
        shell: bash
        run: |
          out=$(./publish/"$ASSET" bench 6)
          echo "$out"
          # Fail if no net
          echo "$out" | grep -q "nnue loaded from embedded best.nnue" || { echo "::error::embedded net missing from build"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: publish/${{ env.ASSET }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
